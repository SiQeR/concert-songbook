ce(0,match.index)+'['+stored+']'+s.chart.slice(match.index+match[0].length);save();render()}}function tick(){if(!scrolling)return;let t=performance.now(),paper=$('paper');if(last)paper.scrollTop+=Math.min(t-last,100)*(+$('speed').value)*.012;last=t;if(paper.scrollTop>=paper.scrollHeight-paper.clientHeight-1){scrolling=false;clearInterval(scrollTimer);scrollTimer=0;last=0;render()}}function toggleScroll(){scrolling=!scrolling;clearInterval(scrollTimer);scrollTimer=0;last=0;if(scrolling)scrollTimer=setInterval(tick,40);render()}$('prev').onclick=()=>select(current-1);$('next').onclick=()=>select(current+1);$('scroll').onclick=toggleScroll;$('down').onclick=()=>{if(!authenticated)return requireLogin(()=>$('down').click());songs[current].transpose--;save();render()};$('up').onclick=()=>{if(!authenticated)return requireLogin(()=>$('up').click());songs[current].transpose++;save();render()};$('edit').onclick=()=>{if(!authenticated)return requireLogin(()=>$('edit').click());if(editing){songs[current].chart=transposeChart($('editor').value,-songs[current].transpose);save()}editing=!editing;render()};$('note').onclick=()=>{if(!authenticated)return requireLogin(()=>$('note').click());let note=prompt('Заметка для этой песни');if(note?.trim()){songs[current].notes.push(note.trim());save();render()}};$('search').oninput=showList;$('add').onsubmit=e=>{e.preventDefault();if(!authenticated)return requireLogin(()=>$('add').requestSubmit());let v=$('newSong').value.trim(),parts=v.split(/\s+[—–-]\s+/);if(!v)return;let artist=parts.length>1?parts.shift():'';songs.push({artist,title:parts.join(' — ')||v,block:4,chart:'',notes:[],transpose:0});save();$('newSong').value='';select(songs.length-1,role==='user')};$('authButton').onclick=()=>{if(authenticated){const wasUser=role==='user';authenticated=false;role=null;authHeader='';sessionStorage.removeItem('concert-admin-basic');if(wasUser){songs=cloneSongs(sharedSongs);current=Math.min(current,songs.length-1);$('speed').value=4;$('saveStatus').textContent='Общий песенник загружен'}editing=false;render()}else requireLogin(()=>{})};$('authCancel').onclick=closeLogin;$('authDialog').onclick=e=>{if(e.target===$('authDialog'))closeLogin()};$('authForm').onsubmit=async e=>{e.preventDefault();const username=$('authUser').value.trim(),password=$('authPass').value,basic=btoa(username+':'+password);$('authError').textContent='Проверяю вход…';try{const response=await fetch(apiUrl,{method:'POST',headers:{Authorization:'Basic '+basic}});if(!response.ok)throw new Error('Неверный логин или пароль.');const result=await response.json();if(result.role!=='admin'&&result.role!=='user')throw new Error('Неизвестная роль.');role=result.role;authenticated=true;authHeader=role==='admin'?basic:'';if(role==='admin')sessionStorage.setItem('concert-admin-basic',basic);else sessionStorage.removeItem('concert-admin-basic');$('authDialog').hidden=true;const action=pendingEdit;pendingEdit=null;render();$('saveStatus').textContent=role==='user'?'Режим user: правки не сохраняются':'Общий песенник загружен';action?.()}catch(error){$('authError').textContent=error.message}};$('toolbarToggle').onclick=()=>{const expanded=$('toolbarToggle').getAttribute('aria-expanded')==='true';$('toolbarToggle').setAttribute('aria-expanded',String(!expanded));$('toolbarToggle').textContent=expanded?'⚙ Настройки ▾':'⚙ Настройки ▴';$('toolbarDetails').hidden=expanded};$('menu').onclick=()=>{$('sidebar').classList.add('open');$('shade').classList.add('open')};$('shade').onclick=()=>{$('sidebar').classList.remove('open');$('shade').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')select(current+1);if(e.key==='ArrowLeft')select(current-1);if(e.code==='Space'){e.preventDefault();toggleScroll()}});render();if(apiUrl){fetch(apiUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Не удалось загрузить общие правки');return r.json()}).then(data=>{if(Array.isArray(data.songs))songs=data.songs;sharedSongs=cloneSongs(songs);sharedReady=true;authenticated=!!role;render();$('saveStatus').textContent='Общий песенник загружен'}).catch(error=>{$('saveStatus').textContent=error.message;$('saveStatus').classList.add('error')})}
</script></body></html>
